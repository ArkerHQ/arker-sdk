[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arker"
version = "0.10.0"
description = "Python client for the Arker virtual computer platform."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Arker", email = "support@arker.ai" }]
keywords = ["arker", "vm", "sandbox", "agent", "code-execution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "typing-extensions>=4.12",
    "dockerfile-parse>=2.0.1",
    "httpx2[http2]>=2.12",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
# Interactive PTY (VM.connect_pty) needs a WebSocket client.
pty = ["websocket-client>=1.7"]

[project.urls]
Homepage = "https://arker.ai"
Documentation = "https://arker.ai/docs"
Source = "https://github.com/ArkerHQ/arker-sdk"
Issues = "https://github.com/ArkerHQ/arker-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/arker"]

[tool.pytest.ini_options]
# tests/e2e hits a live deployment: run it explicitly, with ARKER_API_KEY set.
testpaths = ["tests/unit"]
addopts = "-q"

[dependency-groups]
dev = [
    "datamodel-code-generator==0.45.0",
    "pytest>=9.0.3",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 120
# api_models.py is generated by scripts/generate-openapi and must byte-match
# what the generator emits, so neither the linter nor the formatter may touch it.
extend-exclude = ["src/arker/generated"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # import sorting
    "UP",            # pyupgrade
    "B",             # bugbear
    "SIM", "C4", "PIE", "RET", "TID", "RUF",
]
# A one-line lambda stub reads better than a def; the test transports are full
# of them.
ignore = ["E731"]
