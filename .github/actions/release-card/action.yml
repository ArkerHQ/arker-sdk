name: Release card
description: Post or edit the SDK release's one Slack card in #arker-cd. Never fail a release over it; callers set continue-on-error.

inputs:
  state:
    description: publishing, published, failed or cancelled
    required: true
  package:
    description: typescript, cli, python or go
    required: true
  version:
    required: true
  registry-url:
    required: true
  ts:
    description: Message ts to edit. Empty posts a new card.
    default: ""
  channel:
    description: Channel ID the post returned. Empty when opening.
    default: ""

outputs:
  ts:
    value: ${{ steps.card.outputs.ts }}
  channel:
    value: ${{ steps.card.outputs.channel }}

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::196437631934:role/sdk-release-card
        aws-region: us-west-2

    - id: card
      shell: bash
      env:
        STATE: ${{ inputs.state }}
        PACKAGE: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
        REGISTRY_URL: ${{ inputs.registry-url }}
        TS: ${{ inputs.ts }}
        CHANNEL: ${{ inputs.channel }}
      run: ${{ github.action_path }}/card.sh
