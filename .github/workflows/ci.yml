name: CI

# Mirrors ./scripts/check-local, split so a red X names what broke.
# `pull_request` includes synchronize, so a new commit on a PR re-runs this.

on:
  pull_request:
  push:
    branches: [main]

# Supersede a PR's earlier runs; never cancel main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Repo tooling, not the SDK: contract generation, CLI examples, React demo.
  contract:
    name: contract + tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: bun ci
      - name: Generated artifacts match openapi.json
        run: ./scripts/check-openapi
      - name: Repo tooling tests
        run: uv run --project python --locked --group dev --extra test python -m pytest tests

  # Run from python/ so it collects the SDK suite only. No bun needed.
  python:
    name: python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (fails if uv.lock is stale)
        run: uv sync --locked --group dev --extra test
      - run: uv run --locked --group dev ruff check .
      - run: uv run --locked --group dev ruff format --check .
      - run: uv run --locked --group dev --extra test python -m pytest

  typescript:
    name: typescript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun ci
      - run: bun run typecheck
        working-directory: typescript
      - run: bun run test
        working-directory: typescript

  # Runs from go/ -- its own module, so nothing above it is on the build path.
  go:
    name: go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Tracks go.mod, so the lane compiles against the floor the SDK
          # declares rather than whatever the runner happens to ship.
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      # Type-checks TEST files too, which is the only thing that compiles
      # tests/e2e -- it is never run here (no credentials, and it would create
      # real VMs), so vet is what keeps it from rotting.
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./tests/unit/ -count=1
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  cli:
    name: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun ci
      # cli imports @arker-ai/sdk; its types must exist before typecheck.
      - run: bun run build:sdk
        working-directory: typescript
      - run: bun run typecheck
        working-directory: cli
      - run: bun run test
        working-directory: cli
