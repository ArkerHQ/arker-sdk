name: Publish Python SDK

# Releasing is a version bump: edit `version` in python/pyproject.toml, merge to
# main, and this publishes and then tags `python-v<version>`. The tag is the
# record that the version shipped, which is also what makes a re-run of an
# already-released version a no-op.
#
# Pushing a `python-v*` tag by hand still works as an escape hatch (a re-publish
# after a half-failed run, say) and always publishes.
#
# The tag is created AFTER publishing, by the same job, using GITHUB_TOKEN. A
# tag pushed with GITHUB_TOKEN deliberately does not start another workflow run
# — which is exactly what we want here, since publishing already happened.
#
# Uses PyPI Trusted Publishing (OIDC). One-time setup on PyPI:
#   1. Create a "pending publisher" or claim the project once.
#   2. Add a Trusted Publisher with:
#        Owner:           ArkerHQ
#        Repository:      arker-sdk
#        Workflow name:   publish-python.yml
#        Environment:     pypi   (matches the `environment:` below)

on:
  push:
    branches: [main]
    tags: ["python-v*"]

# Two version bumps landing back to back must not publish concurrently.
concurrency:
  group: publish-python
  cancel-in-progress: false

defaults:
  run:
    working-directory: python

jobs:
  # Cheap gate so an ordinary push to main costs seconds, not a build.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: decide
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version = "(.*)"/\1/p' pyproject.toml | head -1)
          if [ -z "$version" ]; then
            echo "Could not read version from python/pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A hand-pushed tag is an explicit "publish this", so it wins outright.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Tag push: publishing $version"
          elif git ls-remote --exit-code --tags origin "refs/tags/python-v$version" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "python-v$version is already tagged — nothing to release"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "New version $version — releasing"
          fi

  build-and-publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/arker
    permissions:
      id-token: write   # required for Trusted Publishing OIDC
      contents: write   # required to push the release tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify built version matches the release version
        run: |
          set -euo pipefail
          want="${{ needs.check.outputs.version }}"
          built=$(ls dist/arker-*.whl | sed -E 's/.*arker-([^-]+)-.*/\1/')
          if [ "$want" != "$built" ]; then
            echo "Release version $want does not match built version $built"
            exit 1
          fi
          # On a tag push the tag itself must agree with the file it came from.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#python-v}" != "$built" ]; then
            echo "Tag $GITHUB_REF_NAME does not match built version $built"
            exit 1
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

      # Last, so the tag means "this version is on PyPI". If this step fails
      # after a successful upload, tag by hand — do not re-run, PyPI rejects a
      # duplicate upload.
      - name: Tag the release
        if: github.ref_type != 'tag'
        run: |
          set -euo pipefail
          tag="python-v${{ needs.check.outputs.version }}"
          git tag "$tag"
          git push origin "$tag"
          echo "Tagged $tag"
