name: Publish Python SDK

# Version bumps on main publish through PyPI Trusted Publishing and then create
# `python-v<version>`.

on:
  push:
    branches: [main]
    tags: ["python-v*"]

# Two version bumps landing back to back must not publish concurrently.
concurrency:
  group: publish-python
  cancel-in-progress: false

defaults:
  run:
    working-directory: python

jobs:
  # Cheap gate so an ordinary push to main costs seconds, not a build.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write   # the card's AWS role
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
      card_ts: ${{ steps.card.outputs.ts }}
      card_channel: ${{ steps.card.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - id: decide
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^version = "(.*)"/\1/p' pyproject.toml | head -1)
          if [ -z "$version" ]; then
            echo "Could not read version from python/pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A hand-pushed tag is an explicit "publish this", so it wins outright.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Tag push: publishing $version"
          elif git ls-remote --exit-code --tags origin "refs/tags/python-v$version" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "python-v$version is already tagged - nothing to release"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "New version $version - releasing"
          fi

      # The card lives in check and card, not build-and-publish: that job runs in
      # the pypi environment, so its OIDC sub is environment:pypi, and the AWS
      # role trusts only refs/heads/main.
      - id: card
        if: steps.decide.outputs.publish == 'true'
        continue-on-error: true
        uses: ./.github/actions/release-card
        with:
          state: publishing
          package: python
          version: ${{ steps.decide.outputs.version }}
          registry-url: https://pypi.org/project/arker/${{ steps.decide.outputs.version }}/

  build-and-publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/arker
    permissions:
      id-token: write   # required for Trusted Publishing OIDC
      contents: write   # required to push the release tag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify built version matches the release version
        run: |
          set -euo pipefail
          want="${{ needs.check.outputs.version }}"
          built=$(ls dist/arker-*.whl | sed -E 's/.*arker-([^-]+)-.*/\1/')
          if [ "$want" != "$built" ]; then
            echo "Release version $want does not match built version $built"
            exit 1
          fi
          # On a tag push the tag itself must agree with the file it came from.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#python-v}" != "$built" ]; then
            echo "Tag $GITHUB_REF_NAME does not match built version $built"
            exit 1
          fi

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

      # Tag only after a successful upload.
      - name: Tag the release
        if: github.ref_type != 'tag'
        run: |
          set -euo pipefail
          tag="python-v${{ needs.check.outputs.version }}"
          git tag "$tag"
          git push origin "$tag"
          echo "Tagged $tag"

  card:
    needs: [check, build-and-publish]
    if: always() && needs.check.outputs.publish == 'true' && needs.check.outputs.card_ts != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write   # the card's AWS role
    steps:
      - uses: actions/checkout@v4

      - continue-on-error: true
        uses: ./.github/actions/release-card
        with:
          state: ${{ needs.build-and-publish.result == 'success' && 'published' || needs.build-and-publish.result == 'cancelled' && 'cancelled' || 'failed' }}
          package: python
          version: ${{ needs.check.outputs.version }}
          registry-url: https://pypi.org/project/arker/${{ needs.check.outputs.version }}/
          ts: ${{ needs.check.outputs.card_ts }}
          channel: ${{ needs.check.outputs.card_channel }}
