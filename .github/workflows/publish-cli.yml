name: Publish CLI

# Releasing is a version bump: edit `version` in cli/package.json, merge to
# main, and this publishes and then tags `cli-v<version>`. The tag is the record
# that the version shipped, which is also what makes a re-run of an already
# released version a no-op.
#
# Pushing a `cli-v*` tag by hand still works as an escape hatch and always
# publishes.
#
# The tag is created AFTER publishing, by the same job, using GITHUB_TOKEN. A
# tag pushed with GITHUB_TOKEN deliberately does not start another workflow run
# — which is exactly what we want here, since publishing already happened.

on:
  push:
    branches: [main]
    tags: ["cli-v*"]

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: decide
        working-directory: cli
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Tag push: publishing $version"
          elif git ls-remote --exit-code --tags origin "refs/tags/cli-v$version" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "cli-v$version is already tagged — nothing to release"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "New version $version — releasing"
          fi

  build-and-publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm
      url: https://www.npmjs.com/package/@arker-ai/cli
    permissions:
      contents: write   # read the repo, and push the release tag
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install OIDC-capable npm
        run: npm install --global npm@^11.5.1

      - name: Install dependencies
        run: bun ci

      - name: Verify package version matches the release version
        working-directory: cli
        run: |
          set -euo pipefail
          want="${{ needs.check.outputs.version }}"
          pkg=$(bun -e "console.log(require('./package.json').version)")
          if [ "$want" != "$pkg" ]; then
            echo "Release version $want does not match package.json version $pkg"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#cli-v}" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Build SDK
        working-directory: typescript
        run: bun run build:sdk

      - name: Typecheck
        working-directory: cli
        run: bun run typecheck

      - name: Test
        working-directory: cli
        run: bun run test

      - name: Publish to npm
        working-directory: cli
        run: npm publish --access public

      # Last, so the tag means "this version is on npm". If this step fails
      # after a successful publish, tag by hand — do not re-run, npm rejects a
      # duplicate version.
      - name: Tag the release
        if: github.ref_type != 'tag'
        run: |
          set -euo pipefail
          tag="cli-v${{ needs.check.outputs.version }}"
          git tag "$tag"
          git push origin "$tag"
          echo "Tagged $tag"
