name: Publish CLI

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Release candidate identifier
        required: true
      step:
        description: Candidate publication step
        required: true
      attempt:
        description: Current attempt token
        required: true
      sdk_commit:
        description: Full SDK commit SHA
        required: true
      sdk_version:
        description: Exact package version
        required: true

run-name: Publish cli ${{ inputs.sdk_version }} (${{ inputs.attempt }})

concurrency:
  group: publish-cli
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm
    env:
      RELEASE_AUTHORIZATION_REPOSITORY: ${{ secrets.RELEASE_AUTHORIZATION_REPOSITORY }}
      RELEASE_AUTHORIZATION_REF: ${{ vars.RELEASE_AUTHORIZATION_REF }}
      RELEASE_AUTHORIZATION_ROLE: ${{ secrets.RELEASE_AUTHORIZATION_ROLE }}
      RELEASE_AUTHORIZATION_REGION: ${{ vars.RELEASE_AUTHORIZATION_REGION }}
      RELEASE_AUTHORIZATION_BUCKET: ${{ secrets.RELEASE_AUTHORIZATION_BUCKET }}
      RELEASE_AUTHORIZATION_SCRIPT: ${{ secrets.RELEASE_AUTHORIZATION_SCRIPT }}
      RELEASE_AUTHORIZATION_PROJECT: ${{ secrets.RELEASE_AUTHORIZATION_PROJECT }}
      RELEASE_AUTHORIZATION_READ_TOKEN: ${{ secrets.RELEASE_AUTHORIZATION_READ_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          path: .publisher
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sdk_commit }}
          path: source
      - uses: ./.publisher/.github/actions/authorize-release
        with:
          ecosystem: npm
          package: '@arker-ai/cli'
          directory: cli
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@^11.5.1
      - run: bun ci
      - run: bun run build:sdk
        working-directory: source/typescript
      - run: bun run typecheck && bun run test
        working-directory: source/cli
      - uses: ./.publisher/.github/actions/authorize-release
        with:
          ecosystem: npm
          package: '@arker-ai/cli'
          directory: cli
      - run: npm publish --access public
        working-directory: source/cli
      - name: Tag published source
        env:
          VERSION: ${{ inputs.sdk_version }}
        run: |
          set -euo pipefail
          tag="cli-v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "$tag"
          git push origin "refs/tags/$tag"
