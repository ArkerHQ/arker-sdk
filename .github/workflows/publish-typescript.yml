name: Publish TypeScript SDK

# Releasing is a version bump: edit `version` in typescript/package.json, merge
# to main, and this publishes and then tags `typescript-v<version>`. The tag is
# the record that the version shipped, which is also what makes a re-run of an
# already-released version a no-op.
#
# Pushing a `typescript-v*` tag by hand still works as an escape hatch and
# always publishes.
#
# The tag is created AFTER publishing, by the same job, using GITHUB_TOKEN. A
# tag pushed with GITHUB_TOKEN deliberately does not start another workflow run
# — which is exactly what we want here, since publishing already happened.
#
# Publishes to the npm registry with npm trusted publishing.

on:
  push:
    branches: [main]
    tags: ["typescript-v*"]

concurrency:
  group: publish-typescript
  cancel-in-progress: false

defaults:
  run:
    working-directory: typescript

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - id: decide
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Tag push: publishing $version"
          elif git ls-remote --exit-code --tags origin "refs/tags/typescript-v$version" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "typescript-v$version is already tagged — nothing to release"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "New version $version — releasing"
          fi

  build-and-publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@arker-ai/sdk
    permissions:
      contents: write   # read the repo, and push the release tag
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install OIDC-capable npm
        run: npm install --global npm@^11.5.1

      - name: Install deps
        run: bun ci --cwd ..

      - name: Verify package version matches the release version
        run: |
          set -euo pipefail
          want="${{ needs.check.outputs.version }}"
          pkg=$(bun -e "console.log(require('./package.json').version)")
          if [ "$want" != "$pkg" ]; then
            echo "Release version $want does not match package.json version $pkg"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#typescript-v}" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Check generated API types
        run: bun run check:api-types

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Publish to npm
        run: npm publish --access public

      # Last, so the tag means "this version is on npm". If this step fails
      # after a successful publish, tag by hand — do not re-run, npm rejects a
      # duplicate version.
      - name: Tag the release
        if: github.ref_type != 'tag'
        run: |
          set -euo pipefail
          tag="typescript-v${{ needs.check.outputs.version }}"
          git tag "$tag"
          git push origin "$tag"
          echo "Tagged $tag"
