name: Publish TypeScript SDK

# Version bumps on main publish through npm trusted publishing and then create
# `typescript-v<version>`.

on:
  push:
    branches: [main]
    tags: ["typescript-v*"]

concurrency:
  group: publish-typescript
  cancel-in-progress: false

defaults:
  run:
    working-directory: typescript

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write   # the card's AWS role
    outputs:
      version: ${{ steps.decide.outputs.version }}
      publish: ${{ steps.decide.outputs.publish }}
      card_ts: ${{ steps.card.outputs.ts }}
      card_channel: ${{ steps.card.outputs.channel }}
    steps:
      - uses: actions/checkout@v4

      - id: decide
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Tag push: publishing $version"
          elif git ls-remote --exit-code --tags origin "refs/tags/typescript-v$version" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "typescript-v$version is already tagged - nothing to release"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "New version $version - releasing"
          fi

      # The card lives in check and card, not build-and-publish: that job runs in
      # the npm environment, so its OIDC sub is environment:npm, and the AWS
      # role trusts only refs/heads/main.
      - id: card
        if: steps.decide.outputs.publish == 'true'
        continue-on-error: true
        uses: ./.github/actions/release-card
        with:
          role-arn: ${{ vars.RELEASE_CARD_ROLE_ARN }}
          token-parameter: ${{ vars.RELEASE_CARD_TOKEN_PARAMETER }}
          post-channel: ${{ vars.RELEASE_CARD_CHANNEL }}
          state: publishing
          package: typescript
          version: ${{ steps.decide.outputs.version }}
          registry-url: https://www.npmjs.com/package/@arker-ai/sdk/v/${{ steps.decide.outputs.version }}

  build-and-publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm
      url: https://www.npmjs.com/package/@arker-ai/sdk
    permissions:
      contents: write   # read the repo, and push the release tag
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install OIDC-capable npm
        run: npm install --global npm@^11.5.1

      - name: Install deps
        run: bun ci --cwd ..

      - name: Verify package version matches the release version
        run: |
          set -euo pipefail
          want="${{ needs.check.outputs.version }}"
          pkg=$(bun -e "console.log(require('./package.json').version)")
          if [ "$want" != "$pkg" ]; then
            echo "Release version $want does not match package.json version $pkg"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#typescript-v}" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      - name: Check generated API types
        run: bun run check:api-types

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Publish to npm
        run: npm publish --access public

      # Tag only after a successful publish.
      - name: Tag the release
        if: github.ref_type != 'tag'
        run: |
          set -euo pipefail
          tag="typescript-v${{ needs.check.outputs.version }}"
          git tag "$tag"
          git push origin "$tag"
          echo "Tagged $tag"

  card:
    needs: [check, build-and-publish]
    if: always() && needs.check.outputs.publish == 'true' && needs.check.outputs.card_ts != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write   # the card's AWS role
    steps:
      - uses: actions/checkout@v4

      - continue-on-error: true
        uses: ./.github/actions/release-card
        with:
          role-arn: ${{ vars.RELEASE_CARD_ROLE_ARN }}
          token-parameter: ${{ vars.RELEASE_CARD_TOKEN_PARAMETER }}
          post-channel: ${{ vars.RELEASE_CARD_CHANNEL }}
          state: ${{ needs.build-and-publish.result == 'success' && 'published' || needs.build-and-publish.result == 'cancelled' && 'cancelled' || 'failed' }}
          package: typescript
          version: ${{ needs.check.outputs.version }}
          registry-url: https://www.npmjs.com/package/@arker-ai/sdk/v/${{ needs.check.outputs.version }}
          ts: ${{ needs.check.outputs.card_ts }}
          channel: ${{ needs.check.outputs.card_channel }}
