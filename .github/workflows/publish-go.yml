name: Publish Go

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Release candidate identifier
        required: true
      step:
        description: Candidate publication step
        required: true
      attempt:
        description: Current attempt token
        required: true
      sdk_commit:
        description: Full SDK commit SHA
        required: true
      sdk_version:
        description: Exact package version
        required: true

run-name: Publish go ${{ inputs.sdk_version }} (${{ inputs.attempt }})

concurrency:
  group: publish-go
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_AUTHORIZATION_REPOSITORY: ${{ secrets.RELEASE_AUTHORIZATION_REPOSITORY }}
      RELEASE_AUTHORIZATION_REF: ${{ vars.RELEASE_AUTHORIZATION_REF }}
      RELEASE_AUTHORIZATION_ROLE: ${{ secrets.RELEASE_AUTHORIZATION_ROLE }}
      RELEASE_AUTHORIZATION_REGION: ${{ vars.RELEASE_AUTHORIZATION_REGION }}
      RELEASE_AUTHORIZATION_BUCKET: ${{ secrets.RELEASE_AUTHORIZATION_BUCKET }}
      RELEASE_AUTHORIZATION_SCRIPT: ${{ secrets.RELEASE_AUTHORIZATION_SCRIPT }}
      RELEASE_AUTHORIZATION_PROJECT: ${{ secrets.RELEASE_AUTHORIZATION_PROJECT }}
      RELEASE_AUTHORIZATION_READ_TOKEN: ${{ secrets.RELEASE_AUTHORIZATION_READ_TOKEN }}
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          path: .publisher
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sdk_commit }}
          path: source
      - uses: ./.publisher/.github/actions/authorize-release
        with:
          ecosystem: go
          package: github.com/ArkerHQ/arker-sdk/go
          directory: go
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go/go.mod
          cache-dependency-path: source/go/go.sum
      - name: Check Go module
        working-directory: source/go
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)"
          go vet ./...
          go build ./...
          go test ./tests/unit/ -count=1
      - uses: ./.publisher/.github/actions/authorize-release
        with:
          ecosystem: go
          package: github.com/ArkerHQ/arker-sdk/go
          directory: go
      - name: Tag published source
        env:
          VERSION: ${{ inputs.sdk_version }}
        run: |
          set -euo pipefail
          tag="go/v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "$tag"
          git push origin "refs/tags/$tag"
