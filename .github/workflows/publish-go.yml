name: Publish Go

# Go has no registry upload. `proxy.golang.org` fetches modules straight from
# this repo, and the only thing that makes a version exist is a TAG — so
# publishing is exactly one push.
#
# The tag MUST be `go/vX.Y.Z`. That prefix is not a convention: Go requires
# `<subdir>/vX.Y.Z` for a module in a subdirectory, so the hyphenated form the
# other SDKs use (`python-v1.2.7`) would be invisible to the toolchain.
#
# Releasing is a version bump: edit `version` in go/VERSION, merge to main, and
# this tags `go/v<version>`. The tag is the record that the version shipped,
# which is also what makes a re-run of an already released version a no-op.

on:
  push:
    branches: [main]
    paths: ["go/**"]

concurrency:
  group: publish-go
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - id: decide
        run: |
          version="$(tr -d '[:space:]' < go/VERSION)"
          [ -n "$version" ] || { echo "go/VERSION is empty"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/go/v$version" >/dev/null; then
            echo "go/v$version is already tagged; nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # A tag is IMMUTABLE once the proxy has seen it, so the gate runs before
      # it is created rather than after.
      - if: steps.decide.outputs.publish == 'true'
        working-directory: go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go build ./...
          go test ./tests/unit/ -count=1

      - if: steps.decide.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "go/v$VERSION" -m "go/v$VERSION"
          git push origin "go/v$VERSION"
