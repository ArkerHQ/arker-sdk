name: Publish Go

# Run manually to create the required `go/vX.Y.Z` module tag.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the version from go/VERSION to publish it'
        required: true

concurrency:
  group: publish-go
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - id: decide
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          version="$(tr -d '[:space:]' < go/VERSION)"
          [ -n "$version" ] || { echo "go/VERSION is empty"; exit 1; }
          # The typed version must match the file, so publishing is never a
          # stray click on the wrong branch.
          [ "$CONFIRM" = "$version" ] || {
            echo "confirm '$CONFIRM' does not match go/VERSION '$version'"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/go/v$version" >/dev/null; then
            echo "go/v$version is already tagged; nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # A tag is IMMUTABLE once the proxy has seen it, so the gate runs before
      # it is created rather than after.
      - if: steps.decide.outputs.publish == 'true'
        working-directory: go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go build ./...
          go test ./tests/unit/ -count=1

      - if: steps.decide.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "go/v$VERSION" -m "go/v$VERSION"
          git push origin "go/v$VERSION"
