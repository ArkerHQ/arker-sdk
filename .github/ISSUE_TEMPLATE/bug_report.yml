name: Bug report
description: Something in an SDK or the CLI does not work as documented.
labels: [bug]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options: [Python, TypeScript, Go, CLI]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      description: "`pip show arker`, `npm ls @arker-ai/sdk`, `arker --version`, or the version in your go.mod."
      placeholder: "1.3.0"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the full error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: The smallest script or sequence of commands that shows the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output or stack trace
      render: shell
  - type: input
    id: runtime
    attributes:
      label: Runtime and OS
      placeholder: "Python 3.12 on macOS 15"
  - type: input
    id: region
    attributes:
      label: Region
      description: If the problem involves a VM. Leave blank if unsure.
      placeholder: "aws-us-west-2"
  - type: textarea
    id: context
    attributes:
      label: Anything else
